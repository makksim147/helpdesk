<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>

<section th:fragment="commentsBlock(actionUrl)"
         class="card comments-card">

    <div class="comments-heading">

        <h2 class="card-title">
            Переписка по заявке
        </h2>

        <span class="ticket-count"
              th:text="${comments.size()}">
        </span>

    </div>

    <div class="section-divider"></div>

    <div class="comments-empty-state"
         th:if="${comments.isEmpty()}">

        <div class="comments-empty-icon">☏</div>

        <h3>Пока нет комментариев</h3>

        <p>Здесь будет отображаться переписка по заявке.</p>

    </div>

    <div class="comments-list"
         th:unless="${comments.isEmpty()}">

        <article th:each="c : ${comments}"
                 class="comment"
                 th:classappend="${c.author.role.name() == 'ADMIN'
                    ? 'comment-admin' : 'comment-user'}">

            <div class="comment-header">

                <div class="comment-author">

                    <div class="comment-avatar"
                         th:text="${#strings.toUpperCase(#strings.substring(c.author.name, 0, 1))}">
                    </div>

                    <div class="comment-author-info">

                        <strong th:text="${c.author.name}"></strong>

                        <span class="comment-role"
                              th:text="${c.author.role.name() == 'ADMIN'
                                ? 'Специалист поддержки' : 'Пользователь'}">
                        </span>

                    </div>

                </div>

                <time class="comment-date"
                      th:text="${#temporals.format(c.createdAt, 'dd.MM.yyyy HH:mm')}">
                </time>

            </div>

            <p class="comment-text"
               th:text="${c.text}">
            </p>

        </article>

    </div>

    <form class="comment-form"
          th:if="${ticket.status.name() != 'CLOSED'}"
          th:action="${actionUrl}"
          method="post">

        <div class="section-divider"></div>

        <div class="form-group">

            <label for="commentText">
                Ваш комментарий
            </label>

            <textarea id="commentText"
                      name="text"
                      rows="4"
                      maxlength="3000"
                      placeholder="Напишите комментарий..."
                      required></textarea>

            <div class="field-error"
                 th:if="${commentError != null}"
                 th:text="${commentError}">
            </div>

        </div>

        <div class="comment-actions">

            <span class="comment-limit">
                Максимум 3000 символов
            </span>

            <button type="submit"
                    class="btn btn-blue-main">
                Отправить комментарий
            </button>

        </div>

    </form>

    <div class="comments-closed"
         th:if="${ticket.status.name() == 'CLOSED'}">

        <span class="closed-check">✓</span>

        <div>
            <strong>Заявка закрыта</strong>
            <p>Добавление новых комментариев недоступно.</p>
        </div>

    </div>

</section>

</body>
</html>
