<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Создание заявки - HelpDesk</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="navbar">
  <div class="logo">HelpDesk</div>

  <div class="nav-links">

    <a th:href="@{/tickets/my}">Мои заявки</a>
    <a th:href="@{/profile}">Профиль</a>

    <form th:action="@{/logout}" method="post">
      <button type="submit" class="btn btn-red">
        Выйти
      </button>
    </form>

  </div>
</div>

<div class="container">

  <h1 class="page-title">Создание новой заявки</h1>

  <div class="card" style="max-width: 600px;">

    <form th:action="@{/tickets/create}"
          th:object="${ticketForm}"
          method="post">

      <div class="form-group">

        <label>Название</label>

        <input type="text"
               th:field="*{title}"
               maxlength="200"
               required>

        <div class="field-error"
             th:errors="*{title}"></div>

      </div>

      <div class="form-group">

        <label>Описание</label>

        <textarea th:field="*{description}"
                  rows="5"
                  maxlength="5000"
                  required></textarea>

        <div class="field-error"
             th:errors="*{description}"></div>

      </div>

      <div class="form-group">

        <label>Категория</label>

        <select th:field="*{categoryId}" required>

          <option value="">
            -- Выберите категорию --
          </option>

          <option th:each="c : ${categories}"
                  th:value="${c.id}"
                  th:text="${c.name}">
          </option>

        </select>

        <div class="field-error"
             th:errors="*{categoryId}"></div>

      </div>

      <div class="form-group">

        <label>Приоритет</label>

        <select th:field="*{priority}" required>

          <option value="">
            -- Выберите приоритет --
          </option>

          <option th:each="p : ${priorities}"
                  th:value="${p}"
                  th:text="${p.label}">
          </option>

        </select>

        <div class="field-error"
             th:errors="*{priority}"></div>

      </div>

      <div style="display: flex; gap: 10px; margin-top: 20px;">

        <button type="submit" class="btn btn-green">
          Создать заявку
        </button>

        <a th:href="@{/tickets/my}" class="btn btn-red">
          Отмена
        </a>

      </div>

    </form>

  </div>

</div>

</body>
</html>
