<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вход - HelpDesk</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="auth-page">

    <section class="panel auth-panel">

        <div class="auth-heading">

            <span class="brand-mark">?</span>

            <h1>Вход в аккаунт</h1>

            <p>Войдите, чтобы управлять своими заявками</p>

        </div>

        <div class="error-message"
             th:if="${param.error}">
            Неверный email или пароль
        </div>

        <div class="success-message"
             th:if="${param.logout}">
            Вы вышли из системы
        </div>

        <div class="success-message"
             th:if="${param.registered}">
            Регистрация успешна! Войдите.
        </div>

        <div class="success-message"
             th:if="${param.emailChanged}">
            Почта успешно изменена.
            Войдите в аккаунт заново.
        </div>

        <form class="auth-form"
              th:action="@{/login}"
              method="post">

            <div class="field">

                <label for="username">
                    Электронная почта
                </label>

                <input type="email"
                       id="username"
                       name="username"
                       placeholder="example@mail.ru"
                       autocomplete="username"
                       required>

            </div>

            <div class="field">

                <label for="password">Пароль</label>

                <input type="password"
                       id="password"
                       name="password"
                       placeholder="Введите пароль"
                       autocomplete="current-password"
                       required>

            </div>

            <button type="submit"
                    class="button primary auth-submit">
                Войти
            </button>

        </form>

        <p class="auth-link">

            Еще нет аккаунта?

            <a th:href="@{/register}">
                Зарегистрироваться
            </a>

        </p>

    </section>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
