<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Вход - HelpDesk</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="auth-wrapper">
    <div style="font-weight: 600;">HelpDesk</div>
    <h2>Вход</h2>
    <div class="card auth-card">
        <div th:if="${param.error}" style="color: red; margin-bottom: 10px;">
            Неверный email или пароль
        </div>
        <div th:if="${param.logout}" style="color: green; margin-bottom: 10px;">
            Вы вышли из системы
        </div>
        <div th:if="${param.registered}" style="color: green; margin-bottom: 10px;">
            Регистрация успешна! Войдите.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label>Почта</label>
                <input type="email" name="username" required>
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-green">Войти</button>
        </form>
        <a th:href="@{/register}" class="auth-link">Еще нет аккаунта? <span>Зарегистрировать</span></a>
    </div>
</div>
</body>
</html>
