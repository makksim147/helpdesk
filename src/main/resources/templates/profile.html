<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль - HelpDesk</title>
    <link rel="stylesheet" th:href="@{/css/layout.css}">
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="container">

    <div class="page-heading">
        <h1>Мой профиль</h1>
        <p>Просмотр и изменение личных данных</p>
    </div>

    <div class="profile-grid">

        <section class="card">

            <div class="profile-summary">

                <div class="profile-avatar"
                     th:text="${#strings.toUpperCase(#strings.substring(user.name, 0, 1))}">
                    U
                </div>

                <div>
                    <h2 th:text="${user.name}"></h2>
                    <p>Личный аккаунт</p>
                </div>

            </div>

            <div class="section-divider"></div>

            <ul class="info-list">

                <li>
                    <strong>Имя</strong>
                    <span th:text="${user.name}"></span>
                </li>

                <li>
                    <strong>Электронная почта</strong>
                    <span th:text="${user.email}"></span>
                </li>

                <li>
                    <strong>Роль</strong>
                    <span th:text="${user.role.name() == 'ADMIN'
                        ? 'Администратор' : 'Пользователь'}">
                    </span>
                </li>

                <li>
                    <strong>Дата регистрации</strong>
                    <span th:text="${#temporals.format(user.registeredAt, 'dd.MM.yyyy')}">
                    </span>
                </li>

            </ul>

        </section>

        <section class="card">

            <h2 class="card-title">Редактирование профиля</h2>

            <div class="section-divider"></div>

            <div class="success-message"
                 th:if="${param.success}">
                ✓ Данные успешно сохранены
            </div>

            <form th:action="@{/profile}"
                  th:object="${profile}"
                  method="post">

                <div class="form-group">

                    <label for="name">Имя</label>

                    <input type="text"
                           th:field="*{name}"
                           maxlength="100"
                           required>

                    <div class="field-error"
                         th:errors="*{name}"></div>

                </div>

                <div class="form-group">

                    <label for="email">Электронная почта</label>

                    <input type="email"
                           th:field="*{email}"
                           maxlength="254"
                           required>

                    <div class="field-error"
                         th:errors="*{email}"></div>

                </div>

                <p class="form-hint">
                    При изменении почты потребуется
                    повторная авторизация.
                </p>

                <button type="submit"
                        class="btn btn-blue-main">
                    Сохранить изменения
                </button>

            </form>

        </section>

    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
