<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Регистрация - HelpDesk</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="auth-wrapper">
    <div style="font-weight: 600;">HelpDesk</div>
    <h2>Регистрация</h2>
    <div class="card auth-card">
        <div th:if="${error}" style="color: red; margin-bottom: 10px;" th:text="${error}"></div>

        <form th:action="@{/register}" method="post" th:object="${user}">
            <div class="form-group">
                <label>Имя</label>
                <input type="text" th:field="*{name}" required>
            </div>
            <div class="form-group">
                <label>Почта</label>
                <input type="email" th:field="*{email}" required>
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" th:field="*{passwordHash}" required>
            </div>
            <div class="form-group">
                <label>Ввод пароля еще раз</label>
                <input type="password" name="confirmPassword" required>
            </div>
            <button type="submit" class="btn btn-green">Зарегистрироваться</button>
        </form>
        <a th:href="@{/login}" class="auth-link">Уже есть аккаунт? <span>Войти</span></a>
    </div>
</div>
</body>
</html>
