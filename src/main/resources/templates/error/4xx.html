<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ошибка запроса - HelpDesk</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="container error-page">

    <section class="card error-card">

        <div class="error-code" th:text="${status}">400</div>

        <h1>Ошибка запроса</h1>

        <p>
            Не удалось выполнить запрошенное действие.
            Проверьте правильность запроса или вернитесь на главную страницу.
        </p>

        <div class="error-actions">

            <a th:href="@{/}" class="btn btn-blue-main">
                На главную
            </a>

        </div>

    </section>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
